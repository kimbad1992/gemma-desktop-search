<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>Gemma Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop stop-color='%236272ff'/%3E%3Cstop offset='1' stop-color='%2319c2b5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='14.5' cy='14.5' r='6' fill='none' stroke='white' stroke-width='2.6'/%3E%3Cpath d='m19 19 5 5' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* 리퀴드 글래스: 색 얼룩이 있는 바탕(벽) 위에 유리가 뜬다.
   위에 붙은 막대·미리보기·창은 뒤를 흐리는 유리, 결과 카드는 흐림 없이 진한 반투명 채우기(내용 유리). */
:root {
  --wall-base: #e7ebf6; --blob-a: rgba(98, 114, 255, .42); --blob-b: rgba(25, 194, 181, .36); --blob-c: rgba(255, 150, 120, .30); --blob-d: rgba(160, 120, 255, .24);
  --g-thick: rgba(255, 255, 255, .60); --g-content: rgba(255, 255, 255, .80); --g-acrylic: rgba(246, 248, 253, .72); --g-pop: rgba(246, 248, 253, .88); --g-solid: #f3f5fb;
  --g-stroke: rgba(255, 255, 255, .70); --g-hi: rgba(255, 255, 255, .95); --g-lo: rgba(255, 255, 255, .30);
  --g-rim: rgba(255, 255, 255, .95); --g-rim2: rgba(255, 255, 255, .45); --g-sheen: rgba(255, 255, 255, .34);
  --g-shadow: 0 12px 32px rgba(38, 48, 110, .13), 0 1px 3px rgba(38, 48, 110, .08);
  --card-shadow: 0 4px 14px rgba(10, 14, 40, .07);
  --bead: rgba(255, 255, 255, .88); --bead-shadow: 0 2px 8px rgba(38, 48, 110, .13);
  --ctl: rgba(255, 255, 255, .62); --ctl-hover: rgba(255, 255, 255, .84); --ctl-active: rgba(255, 255, 255, .48);
  --ctl-stroke: rgba(30, 40, 90, .11); --ctl-stroke-hover: rgba(30, 40, 90, .22);
  --well: rgba(255, 255, 255, .55); --well-stroke: rgba(30, 40, 90, .08); --well-in: inset 0 1px 2px rgba(30, 40, 90, .07);
  --hair: rgba(30, 40, 90, .09); --track: rgba(30, 40, 90, .12); --inset: rgba(30, 40, 90, .06);
  --text: #262a3b; --strong: #10131f; --muted: #586078;
  --accent: #4f5be6; --accent2: #0ea096; --accent-text: #3b46cf;
  --ok: #13824a; --warn: #955e00; --danger: #c92a2a;
  --hl-bg: #c7efe9; --hl-fg: #065c56;
  --indigo: #4f5be6; --teal: #0c8c82; --coral: #cc4e36; --amber: #ac6e00; --violet: #8050d8; --green: #168a4a; --gray: #687086;
  --tint: 14%;
  /* 위에 붙은 막대의 높이 (스크립트가 잰 값으로 바꾼다) */
  --top-h: 124px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --wall-base: #0a0c13; --blob-a: rgba(98, 114, 255, .42); --blob-b: rgba(25, 194, 181, .26); --blob-c: rgba(214, 92, 150, .20); --blob-d: rgba(124, 92, 255, .28);
    --g-thick: rgba(24, 28, 44, .60); --g-content: rgba(15, 18, 28, .76); --g-acrylic: rgba(20, 23, 36, .74); --g-pop: rgba(20, 23, 36, .88); --g-solid: #0d0f17;
    --g-stroke: rgba(255, 255, 255, .10); --g-hi: rgba(255, 255, 255, .20); --g-lo: rgba(255, 255, 255, .04);
    --g-rim: rgba(255, 255, 255, .42); --g-rim2: rgba(255, 255, 255, .12); --g-sheen: rgba(255, 255, 255, .06);
    --g-shadow: 0 14px 36px rgba(0, 0, 0, .45), 0 1px 2px rgba(0, 0, 0, .4);
    --card-shadow: 0 4px 14px rgba(0, 0, 0, .22);
    --bead: rgba(255, 255, 255, .13); --bead-shadow: 0 2px 10px rgba(0, 0, 0, .35);
    --ctl: rgba(255, 255, 255, .07); --ctl-hover: rgba(255, 255, 255, .12); --ctl-active: rgba(255, 255, 255, .05);
    --ctl-stroke: rgba(255, 255, 255, .10); --ctl-stroke-hover: rgba(255, 255, 255, .20);
    --well: rgba(0, 0, 0, .24); --well-stroke: rgba(255, 255, 255, .06); --well-in: inset 0 1px 2px rgba(0, 0, 0, .32);
    --hair: rgba(255, 255, 255, .08); --track: rgba(255, 255, 255, .13); --inset: rgba(0, 0, 0, .30);
    --text: #dde1ef; --strong: #f5f6fb; --muted: #959cb6;
    --accent: #6272ff; --accent2: #19c2b5; --accent-text: #a6b0ff;
    --ok: #52d99b; --warn: #f4b14c; --danger: #ff7f77;
    --hl-bg: #134649; --hl-fg: #8cf0e5;
    --indigo: #9da8ff; --teal: #5fdcd1; --coral: #ff9680; --amber: #f4b454; --violet: #c69aff; --green: #68dea4; --gray: #9aa0b4;
    --tint: 18%;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--wall-base); color: var(--text);
  font: 14px/1.5 Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* 바탕은 스크롤해도 제자리: 결과가 막대 밑으로 지나갈 때 유리가 바탕과 결과를 함께 흐린다 */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(55% 65% at 8% 10%, var(--blob-a), transparent 70%),
    radial-gradient(50% 60% at 92% 12%, var(--blob-b), transparent 70%),
    radial-gradient(55% 60% at 78% 100%, var(--blob-c), transparent 72%),
    radial-gradient(45% 55% at 18% 95%, var(--blob-d), transparent 72%),
    var(--wall-base);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.grad { background: linear-gradient(90deg, var(--accent), var(--accent2)); }

/* 유리: 흐림 + 채도 + 위쪽 광택 + 가장자리 빛 */
.glass {
  --fill: var(--g-thick);
  position: relative;
  background: linear-gradient(180deg, var(--g-sheen), transparent 46%), var(--fill);
  -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8);
  border: 1px solid var(--g-stroke);
  box-shadow: inset 0 1px 0 var(--g-hi), inset 0 -1px 0 var(--g-lo), var(--g-shadow);
}
.glass.acrylic { --fill: var(--g-acrylic); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6); }
.glass::before {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(145deg, var(--g-rim) 0%, transparent 28%, transparent 70%, var(--g-rim2) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
/* 흐림을 못 하는 브라우저, 투명도를 줄이라는 설정: 거의 불투명하게 */
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .glass, .glass.acrylic { --fill: var(--g-solid); }
}
@media (prefers-reduced-transparency: reduce) {
  .glass, .glass.acrylic { --fill: var(--g-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
}

.app { max-width: 1240px; margin: 0 auto; padding: 12px 20px 48px; }

/* 위에 붙은 유리 막대: 머리 줄 + 검색창 + 거르기 */
.top { position: sticky; top: 12px; z-index: 10; margin-bottom: 16px; }
.topbar { display: grid; gap: 10px; padding: 10px 12px; border-radius: 28px; }
.r1 { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
}
.logo svg { width: 18px; height: 18px; stroke-width: 2.6; }
.brand { flex: none; font-size: 16px; font-weight: 700; line-height: 1.25; color: var(--strong); letter-spacing: -.01em; }
.brand small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; border: 0; flex: none;
  background: var(--ctl); box-shadow: inset 0 1px 0 var(--g-hi), inset 0 0 0 1px var(--ctl-stroke); color: var(--text); white-space: nowrap;
}
.pill:hover { background: var(--ctl-hover); box-shadow: inset 0 1px 0 var(--g-hi), inset 0 0 0 1px var(--ctl-stroke-hover); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--ok) 24%, transparent); }
.dot.warn { background: var(--warn); }
.dot.danger { background: var(--danger); box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--danger) 24%, transparent); }
.dot.busy { background: var(--accent2); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* 상태: 막대 아래에 뜨는 유리 창 (막대 안에 넣으면 막대의 흐림이 겹쳐 뒤가 비치지 않는다) */
.status {
  position: absolute; top: calc(100% + 8px); right: 0; width: min(640px, 100%); max-height: calc(100vh - var(--top-h) - 44px); overflow: auto;
  padding: 16px 18px; border-radius: 22px; display: grid; gap: 12px;
}
/* 글이 많은 창이라 아크릴보다 진하게. 안쪽이 스크롤되므로 가장자리 빛은 뺀다 */
.status.glass { --fill: var(--g-pop); }
.status::before { display: none; }
.status h3 { margin: 0 0 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 22px; }
.facts b { color: var(--strong); font-weight: 600; }
.roots { display: grid; gap: 6px; }
.root { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); }
.root span.p { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card { background: var(--g-content); border: 1px solid var(--g-stroke); border-radius: 20px; box-shadow: inset 0 1px 0 var(--g-hi), var(--card-shadow); }
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; flex: none; font-size: 11.5px; font-weight: 500; white-space: nowrap;
  color: var(--muted); background: color-mix(in srgb, var(--muted) var(--tint), transparent);
}
.tag.info { color: var(--accent-text); background: color-mix(in srgb, var(--accent-text) var(--tint), transparent); }
.tag.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) var(--tint), transparent); }
.tag.kw { color: var(--hl-fg); background: var(--hl-bg); }
.note {
  display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 14px; color: var(--warn);
  background: color-mix(in srgb, var(--warn) var(--tint), transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 30%, transparent);
}
.note.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) var(--tint), transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 30%, transparent); }
.note svg { margin-top: 2px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 15px; border-radius: 999px; border: 0;
  background: var(--ctl); box-shadow: inset 0 1px 0 var(--g-hi), inset 0 0 0 1px var(--ctl-stroke);
  color: var(--text); font-weight: 500; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--ctl-hover); box-shadow: inset 0 1px 0 var(--g-hi), inset 0 0 0 1px var(--ctl-stroke-hover); }
.btn:active { background: var(--ctl-active); }
.btn.primary {
  color: #fff; font-weight: 600;
  background: linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 55%), linear-gradient(90deg, var(--accent), var(--accent2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), inset 0 -1px 0 rgba(0, 0, 0, .14), 0 6px 18px color-mix(in srgb, var(--accent) 38%, transparent);
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { width: 32px; padding: 0; background: transparent; box-shadow: none; color: var(--muted); }
.btn.ghost:hover { background: var(--ctl-hover); box-shadow: inset 0 0 0 1px var(--ctl-stroke); color: var(--text); }
.progress { height: 8px; border-radius: 999px; background: var(--track); box-shadow: var(--well-in); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s; }
.progress.indet i { width: 35%; animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
.sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 검색창: 오목하게 들어간 우물 */
.field {
  display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 5px 0 16px; border-radius: 999px; flex: 1; min-width: 0;
  background: var(--well); box-shadow: var(--well-in), inset 0 0 0 1px var(--well-stroke); transition: box-shadow .12s;
}
.field:focus-within {
  box-shadow: var(--well-in), inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.field svg { color: var(--accent-text); width: 18px; height: 18px; }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; color: var(--strong); }
.field input::placeholder { color: var(--muted); }
.field .btn.primary { height: 34px; padding: 0 16px; }
.filters { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 0 4px 2px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 0; white-space: nowrap;
  background: var(--ctl); box-shadow: inset 0 1px 0 var(--g-hi), inset 0 0 0 1px var(--ctl-stroke); color: var(--text);
}
.chip:hover { background: var(--ctl-hover); }
/* 막대 안의 종류 칩: 바탕 없이, 고른 것만 구슬처럼 */
.chips .chip { background: transparent; box-shadow: none; color: var(--muted); }
.chips .chip:hover { background: var(--ctl); color: var(--text); }
.chips .chip.on { background: var(--bead); box-shadow: inset 0 1px 0 var(--g-hi), inset 0 0 0 1px var(--g-stroke), var(--bead-shadow); color: var(--accent-text); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: default; }
.chips .chip:disabled:hover { background: transparent; color: var(--muted); }
.chip b { font-weight: 600; opacity: .75; }
/* 줄이 넘치면 경로 칸·관련도가 다음 줄의 오른쪽에 붙는다 */
.slider { display: flex; align-items: center; gap: 9px; color: var(--muted); white-space: nowrap; margin-left: auto; }
.slider b { color: var(--strong); min-width: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
input[type=range] { width: 120px; accent-color: var(--accent); }
.mini {
  height: 30px; width: 210px; padding: 0 13px; border-radius: 999px; border: 0; outline: 0; font-size: 13px;
  background: var(--well); box-shadow: var(--well-in), inset 0 0 0 1px var(--well-stroke);
}
.mini::placeholder { color: var(--muted); }
.mini:focus { box-shadow: var(--well-in), inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.main.split { grid-template-columns: minmax(0, 1fr) minmax(380px, 44%); }
.summary { color: var(--muted); margin: 2px 6px 10px; }
.summary b { color: var(--strong); font-weight: 600; }
.list { display: grid; gap: 8px; }
/* 결과 카드: 흐리지 않는 내용 유리. 화살표로 고른 카드가 막대에 가리지 않게 여백을 둔다 */
.hit {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left;
  padding: 10px 14px 10px 10px; border-radius: 18px; background: var(--g-content); border: 1px solid var(--g-stroke);
  box-shadow: inset 0 1px 0 var(--g-hi), var(--card-shadow); transition: border-color .12s, background-color .12s;
  scroll-margin: calc(var(--top-h) + 26px) 0 16px;
}
.hit:hover { border-color: color-mix(in srgb, var(--accent) 34%, var(--g-stroke)); }
.hit.sel { background: color-mix(in srgb, var(--accent) 16%, var(--g-content)); border-color: color-mix(in srgb, var(--accent) 52%, transparent); }
.hit:focus-visible, .btn:focus-visible, .chip:focus-visible, .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumb { width: 56px; height: 56px; border-radius: 14px; overflow: hidden; display: grid; place-items: center; background: var(--inset); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg { width: 22px; height: 22px; }
.k-indigo { color: var(--indigo); background: color-mix(in srgb, var(--indigo) var(--tint), transparent); }
.k-teal { color: var(--teal); background: color-mix(in srgb, var(--teal) var(--tint), transparent); }
.k-coral { color: var(--coral); background: color-mix(in srgb, var(--coral) var(--tint), transparent); }
.k-amber { color: var(--amber); background: color-mix(in srgb, var(--amber) var(--tint), transparent); }
.k-violet { color: var(--violet); background: color-mix(in srgb, var(--violet) var(--tint), transparent); }
.k-green { color: var(--green); background: color-mix(in srgb, var(--green) var(--tint), transparent); }
.k-gray { color: var(--gray); background: color-mix(in srgb, var(--gray) var(--tint), transparent); }
.k-indigo, .k-teal, .k-coral, .k-amber, .k-violet, .k-green, .k-gray {
  box-shadow: inset 0 1px 0 var(--g-hi), inset 0 0 0 1px color-mix(in srgb, currentColor 24%, transparent);
}
.hit .l1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.name { font-weight: 600; color: var(--strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; gap: 5px; flex: none; }
.snip { color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; overflow-wrap: anywhere; }
mark { background: var(--hl-bg); color: var(--hl-fg); border-radius: 4px; padding: 0 2px; font-weight: 600; }
.path { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.path bdi { direction: ltr; unicode-bidi: isolate; }
.score { display: grid; justify-items: end; gap: 5px; min-width: 60px; }
.score b { font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { width: 56px; height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: currentColor; }
.score.hi { color: var(--ok); }
.score.hi .bar i { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.score.mid { color: var(--accent-text); }
.score.lo { color: var(--muted); }
.empty { padding: 44px 24px; text-align: center; color: var(--muted); }
.empty h2 { margin: 0 0 6px; font-size: 16px; color: var(--strong); font-weight: 600; }
.empty .ex { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--track); border-top-color: var(--accent); animation: rot .8s linear infinite; margin: 0 auto 12px; }
@keyframes rot { to { transform: rotate(360deg); } }

/* 미리보기: 막대 바로 밑에 붙는 진한 유리 */
.preview {
  position: sticky; top: calc(12px + var(--top-h) + 16px); max-height: calc(100vh - var(--top-h) - 42px);
  display: flex; flex-direction: column; border-radius: 24px;
}
.pv-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--hair); }
.pv-head .name { flex: 1; font-size: 15px; }
.pv-body { overflow: auto; padding: 14px 16px 16px; display: grid; gap: 12px; border-radius: 0 0 23px 23px; }
.media { border-radius: 14px; overflow: hidden; background: var(--inset); display: grid; place-items: center; min-height: 120px; box-shadow: inset 0 0 0 1px var(--hair); }
.media img, .media video { max-width: 100%; max-height: 62vh; display: block; }
.media audio { width: 100%; margin: 18px 0; padding: 0 14px; }
.media iframe { width: 100%; height: 66vh; border: 0; background: #fff; }
.media pre { margin: 0; padding: 14px 16px; width: 100%; max-height: 62vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 ui-monospace, "Cascadia Mono", Consolas, "D2Coding", monospace; color: var(--text); justify-self: stretch; }
.media .cant { padding: 28px 18px; color: var(--muted); text-align: center; }
.quote { padding: 10px 12px; border-radius: 14px; background: var(--well); box-shadow: var(--well-in), inset 0 0 0 1px var(--well-stroke); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; color: var(--muted); font-size: 13px; }
.kv span:nth-child(even) { color: var(--text); overflow-wrap: anywhere; }

.gate { max-width: 420px; margin: 12vh auto 0; padding: 26px; display: grid; gap: 14px; border-radius: 24px; }
.gate h2 { margin: 0; font-size: 17px; color: var(--strong); }
.gate p { margin: 0; color: var(--muted); }
.gate .field { flex: none; height: 46px; }
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); padding: 9px 18px; border-radius: 999px; z-index: 30;
  background: var(--strong); color: var(--wall-base); font-weight: 600; box-shadow: var(--g-shadow);
}

@media (max-width: 980px) {
  .app { padding: 10px 12px 40px; }
  .top { top: 8px; }
  .main.split { grid-template-columns: minmax(0, 1fr); }
  /* 휴대폰·좁은 창: 미리보기는 화면 전체를 덮는다. 흐림 대신 거의 불투명하게 */
  .preview {
    position: fixed; inset: 0; max-height: none; border-radius: 0; border: 0; z-index: 20;
    --fill: var(--g-solid); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none;
  }
  .preview::before { display: none; }
  .pv-body { border-radius: 0; }
  .brand small, .slider span, .pill .long { display: none; }
  .mini { width: 100%; }
  .hit { grid-template-columns: 48px minmax(0, 1fr) auto; padding: 9px 12px 9px 9px; }
  .thumb { width: 48px; height: 48px; border-radius: 12px; }
  .tags .opt { display: none; }
}
@media (max-width: 720px) {
  /* 휴대폰 폭: 막대가 높아지므로 붙이지 않고 같이 올라가게 둔다. 결과 카드에는 흐림이 없다 */
  .top { position: relative; top: auto; }
  .topbar { border-radius: 24px; }
  .r1 { flex-wrap: wrap; }
  .r1 .field { order: 3; flex-basis: 100%; }
  .r1 .brand { flex: 1; }
  .status { width: 100%; max-height: 70vh; }
  .slider { margin-left: 0; }
  .hit { scroll-margin: 16px 0; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top" id="top">
    <form class="topbar glass" id="form" autocomplete="off">
      <div class="r1">
        <div class="logo grad"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div>
        <div class="brand">Gemma Search<small>뜻으로 찾는 파일 검색</small></div>
        <div class="field">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="찾고 싶은 내용을 말로 적어 보세요" enterkeyhint="search" autofocus>
          <button class="btn primary" type="submit">검색</button>
        </div>
        <button class="pill" id="statusBtn" type="button" title="상태 보기"><span class="dot" id="statusDot"></span><span id="statusText">연결하는 중…</span></button>
      </div>
      <div class="filters">
        <div class="chips" id="chips"></div>
        <div class="spacer"></div>
        <input class="mini" id="path" type="text" placeholder="경로에 들어 있는 말 (선택)" title="이 말이 경로에 들어 있는 파일만 찾습니다. 띄어 쓰면 모두 들어 있어야 합니다.">
        <label class="slider" title="이 값보다 관련도가 낮은 결과는 숨깁니다. 검색어가 그대로 들어 있는 결과는 항상 보입니다."><span>최소 관련도</span><input id="min" type="range" min="0" max="10" step="0.5" value="5.5"><b id="minVal">5.5</b></label>
      </div>
    </form>
    <section class="status glass acrylic" id="statusPanel" hidden></section>
  </div>

  <div class="main" id="main">
    <div>
      <div class="summary" id="summary" hidden></div>
      <div class="list" id="list"></div>
    </div>
    <aside class="preview glass" id="preview" hidden></aside>
  </div>
</div>

<div class="gate glass" id="gate" hidden>
  <h2>접속 토큰이 필요합니다</h2>
  <p>이 검색 서비스는 다른 기기에서 접속할 수 있게 열려 있어 토큰을 확인합니다. 서비스를 띄운 화면에 나온 토큰이나 설정 파일의 <b>service_token</b> 값을 넣어 주세요.</p>
  <form id="gateForm"><div class="field"><input id="token" type="password" placeholder="토큰" autocomplete="current-password"><button class="btn primary" type="submit">확인</button></div></form>
  <p id="gateMsg" style="color:var(--danger)" hidden>토큰이 맞지 않습니다.</p>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const ICON = {
  text: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  code: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m10 13-2 2 2 2"/><path d="m14 17 2-2-2-2"/>',
  doc: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  image: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  video: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>',
  audio: '<path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/>',
  other: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  open: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  down: '<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
};
const CODE = /\.(rs|py|js|mjs|ts|tsx|jsx|c|h|cc|cpp|hpp|cs|java|kt|go|rb|php|swift|sh|bash|ps1|bat|sql|html|css|scss|json|toml|yaml|yml|xml|lua|dart|vue)$/i;
const SECTIONS = [['docs', '문서 내용'], ['images', '이미지'], ['videos', '영상'], ['audio', '오디오'], ['names', '파일 이름']];
const EXAMPLES = ['바닷가에서 찍은 노을 사진', '작년 예산 회의에서 정한 것', '고양이가 나오는 영상', '계약서 해지 조항'];
const state = { data: null, tab: 'all', sel: null, seq: 0, busy: false, status: null, statusOpen: false, error: null, minTouched: false };

// 화면 조각 만들기. 파일 이름·발췌 같은 자료는 언제나 글자로만 넣는다 (HTML로 해석하지 않는다).
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'i');
  s.setAttribute('viewBox', '0 0 24 24');
  s.innerHTML = ICON[name] || ICON.other;
  return s;
}
const num = (n) => Number(n || 0).toLocaleString('ko-KR');
function ago(secs) {
  if (secs < 60) return '방금';
  if (secs < 3600) return Math.floor(secs / 60) + '분 전';
  if (secs < 86400) return Math.floor(secs / 3600) + '시간 전';
  return Math.floor(secs / 86400) + '일 전';
}
function until(secs) {
  if (secs < 60) return '곧';
  if (secs < 3600) return Math.ceil(secs / 60) + '분 뒤';
  return Math.round(secs / 360) / 10 + '시간 뒤';
}
function toast(text) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = h('div', { class: 'toast' }, text);
  document.body.append(t);
  setTimeout(() => t.remove(), 1800);
}

// ── 접속 ──
function setToken(t) {
  document.cookie = 'gs_token=' + encodeURIComponent(t) + '; path=/; max-age=31536000; SameSite=Strict';
}
function askToken(wrong) {
  $('app').hidden = true;
  $('gate').hidden = false;
  $('gateMsg').hidden = !wrong;
  $('token').focus();
}
async function api(path, opts) {
  const r = await fetch(path, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opts));
  if (r.status === 401) {
    askToken(document.cookie.includes('gs_token='));
    throw new Error('토큰이 필요합니다');
  }
  let j = null;
  try { j = await r.json(); } catch (e) { /* JSON이 아니면 아래에서 처리 */ }
  if (!r.ok || !j) throw new Error((j && j.error) || '요청을 처리하지 못했습니다 (' + r.status + ')');
  return j;
}
$('gateForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  setToken($('token').value.trim());
  $('gate').hidden = true;
  $('app').hidden = false;
  await poll();
});

// ── 상태 ──
async function poll() {
  try {
    state.status = await api('/api/status');
    if (!state.minTouched) setMin(state.status.min_relevance);
  } catch (e) {
    state.status = null;
  }
  renderStatus();
}
function renderStatus() {
  const s = state.status;
  const dot = $('statusDot');
  dot.className = 'dot';
  if (!s) {
    dot.classList.add('danger');
    $('statusText').textContent = '서비스에 연결할 수 없습니다';
    $('statusPanel').hidden = true;
    return;
  }
  const idx = s.indexing;
  let text;
  if (idx.active) {
    dot.classList.add('busy');
    const pct = idx.fraction != null ? ' ' + Math.round(idx.fraction * 100) + '%' : '';
    text = (idx.targeted ? '바뀐 파일 반영 중' : '인덱싱 중') + pct;
  } else if (s.server.error) {
    dot.classList.add('danger');
    text = '서버 오류';
  } else if (s.server.ready) {
    dot.classList.add('ok');
    text = '준비됨';
  } else if (s.server.key === 'stopped') {
    text = '대기 중';
  } else {
    dot.classList.add('busy');
    text = '서버 켜는 중';
  }
  $('statusText').replaceChildren(text, h('span', { class: 'long' }, ' · 파일 ' + num(s.index.files) + '개'));
  const panel = $('statusPanel');
  panel.hidden = !state.statusOpen;
  if (!state.statusOpen) return;
  const w = s.watch;
  const facts = h('div', { class: 'facts' },
    h('div', {}, h('h3', {}, '검색 서버'), h('b', {}, s.server.ready ? '준비됨' : s.server.state),
      h('div', { class: 'sub' }, s.server.ready ? '한동안 쓰지 않으면 꺼지고, 검색하면 다시 켜집니다' : '검색하거나 바뀐 파일이 생기면 켜집니다')),
    h('div', {}, h('h3', {}, '인덱스'), h('b', {}, '파일 ' + num(s.index.files) + '개'),
      h('div', { class: 'sub' }, '벡터 ' + num(s.index.vectors) + '개 · v' + s.version)),
    h('div', {}, h('h3', {}, '폴더 감시'),
      w.enabled
        ? [h('b', {}, w.scanning ? '폴더를 확인하는 중' : (w.pending ? '반영 대기 ' + num(w.pending) + '개' : '감시 중')),
           h('div', { class: 'sub' },
             (w.last_scan ? '마지막 확인 ' + ago(w.last_scan.ago_secs) + ' (변경 ' + num(w.last_scan.found) + '개)' : '아직 확인하지 않음')
             + (w.next_scan_secs != null ? ' · 다음 ' + until(w.next_scan_secs) : ''))]
        : [h('b', {}, '꺼짐'), h('div', { class: 'sub' }, '바뀐 파일을 자동으로 반영하지 않습니다')]),
  );
  const kids = [facts];
  if (idx.active) {
    kids.push(h('div', {},
      h('div', { class: 'progress' + (idx.fraction == null ? ' indet' : '') }, h('i', { style: idx.fraction != null ? 'width:' + Math.round(idx.fraction * 100) + '%' : null })),
      h('div', { class: 'sub', style: 'margin-top:6px' },
        (idx.scanning ? '파일을 찾는 중 · ' + num(idx.discovered) + '개' : num(idx.processed) + ' / ' + num(idx.discovered)) + (idx.current ? ' · ' + idx.current : ''))));
  }
  for (const p of s.problems || []) kids.push(h('div', { class: 'note' }, icon('warn'), h('span', {}, p)));
  if (s.server.error) kids.push(h('div', { class: 'note danger' }, icon('warn'), h('span', {}, s.server.error)));
  if (w.enabled && w.note) kids.push(h('div', { class: 'note' }, icon('warn'), h('span', {}, w.note)));
  const roots = w.enabled ? w.roots : (s.roots || []).map((p) => ({ path: p }));
  if (roots.length) {
    kids.push(h('div', { class: 'roots' }, roots.map((r) => h('div', { class: 'root' }, icon('folder'),
      h('span', { class: 'p', title: r.path }, r.path),
      r.registering ? h('span', { class: 'tag' }, '연결하는 중') : null,
      r.error ? h('span', { class: 'tag warn', title: r.error }, '감시할 수 없음') : null,
      r.network ? h('span', { class: 'tag info', title: '네트워크 폴더는 바뀐 것을 바로 알려 주지 않을 수 있어, 주기적으로 훑어서 확인합니다.' },
        '네트워크 · ' + (w.rescan_hours ? w.rescan_hours + '시간마다 확인' : '켤 때만 확인')) : null))));
  }
  kids.push(h('div', { class: 'row' },
    w.enabled
      ? h('button', { class: 'btn', type: 'button', title: '폴더를 훑어 바뀐 파일을 찾아 반영합니다', onclick: () => post('/api/rescan', '폴더를 확인합니다') }, icon('refresh'), '지금 확인')
      : h('button', { class: 'btn', type: 'button', onclick: () => post('/api/index', '바뀐 파일을 인덱싱합니다') }, icon('refresh'), '바뀐 파일 인덱싱')));
  panel.replaceChildren(...kids);
}
async function post(path, done) {
  try {
    await api(path, { method: 'POST' });
    toast(done);
    setTimeout(poll, 600);
  } catch (e) {
    toast(e.message);
  }
}
$('statusBtn').addEventListener('click', () => {
  state.statusOpen = !state.statusOpen;
  renderStatus();
});
// 상태 창 밖을 누르면 닫는다
document.addEventListener('pointerdown', (ev) => {
  if (state.statusOpen && !$('top').contains(ev.target)) {
    state.statusOpen = false;
    renderStatus();
  }
});
// 위에 붙은 막대의 높이: 미리보기가 그 밑에 붙고, 화살표로 고른 결과가 막대에 가리지 않게 한다
new ResizeObserver(() => document.documentElement.style.setProperty('--top-h', $('form').offsetHeight + 'px')).observe($('form'));

// ── 검색 ──
function setMin(v) {
  $('min').value = v;
  $('minVal').textContent = Number(v) > 0 ? Number(v).toFixed(1) : '끔';
}
async function search() {
  const q = $('q').value.trim();
  if (!q) return;
  const seq = ++state.seq;
  state.busy = true;
  state.error = null;
  render();
  const p = new URLSearchParams({ q, min: $('min').value });
  if ($('path').value.trim()) p.set('path', $('path').value.trim());
  history.replaceState(null, '', '?q=' + encodeURIComponent(q));
  // 서버가 꺼져 있으면 켜지는 동안 상태를 자주 본다
  const tick = setInterval(poll, 1500);
  try {
    const d = await api('/api/search?' + p);
    if (seq !== state.seq) return;
    state.data = d;
    state.sel = null;
    if (state.tab !== 'all' && !d.sections.some((s) => s.key === state.tab)) state.tab = 'all';
  } catch (e) {
    if (seq !== state.seq) return;
    state.error = e.message;
    state.data = null;
  } finally {
    clearInterval(tick);
    if (seq === state.seq) {
      state.busy = false;
      render();
      poll();
    }
  }
}
function shown() {
  const d = state.data;
  if (!d) return [];
  if (state.tab === 'all') return d.all;
  const s = d.sections.find((x) => x.key === state.tab);
  return s ? s.hits : [];
}
function look(hit) {
  if (hit.kind === 'text') return CODE.test(hit.name) ? ['k-teal', 'code'] : ['k-indigo', 'text'];
  return { doc: ['k-coral', 'doc'], image: ['k-amber', 'image'], video: ['k-violet', 'video'], audio: ['k-green', 'audio'] }[hit.kind] || ['k-gray', 'other'];
}
const tone = (score) => (score >= 7 ? 'hi' : score >= 5.5 ? 'mid' : 'lo');
function snippet(hit, cls) {
  if (hit.highlight) return h('div', { class: cls }, hit.highlight.map(([t, hot]) => (hot ? h('mark', {}, t) : t)));
  return hit.snippet ? h('div', { class: cls }, hit.snippet) : null;
}
function renderChips() {
  const d = state.data;
  const count = (key) => {
    if (!d) return null;
    if (key === 'all') return d.all.length;
    const s = d.sections.find((x) => x.key === key);
    return s ? s.hits.length : 0;
  };
  $('chips').replaceChildren(...[['all', '전체']].concat(SECTIONS).map(([key, label]) => {
    const n = count(key);
    return h('button', {
      class: 'chip' + (state.tab === key ? ' on' : ''), type: 'button', disabled: d && key !== 'all' && !n,
      style: d && key !== 'all' && !n ? 'opacity:.45;cursor:default' : null,
      onclick: () => { state.tab = key; state.sel = null; render(); },
    }, label, n != null ? h('b', {}, n) : null);
  }));
}
function render() {
  renderChips();
  const list = $('list');
  const sum = $('summary');
  sum.hidden = true;
  if (state.busy) {
    const s = state.status;
    const waiting = s && !s.server.ready;
    list.replaceChildren(h('div', { class: 'card empty' }, h('div', { class: 'spin' }),
      h('h2', {}, waiting ? '검색 서버를 켜는 중입니다' : '찾는 중입니다'),
      waiting ? h('div', {}, '모델을 올리는 데 10~30초쯤 걸립니다. 한 번 켜지면 다음 검색부터는 바로 나옵니다.') : null));
    renderPreview();
    return;
  }
  if (state.error) {
    list.replaceChildren(h('div', { class: 'card empty' }, h('h2', {}, '검색하지 못했습니다'), h('div', {}, state.error)));
    renderPreview();
    return;
  }
  const d = state.data;
  if (!d) {
    list.replaceChildren(h('div', { class: 'card empty' }, h('h2', {}, '무엇을 찾으세요?'),
      h('div', {}, '파일 이름을 몰라도 됩니다. 내용이나 장면을 말로 적으면 문서·사진·영상·소리에서 뜻이 가까운 것을 찾습니다.'),
      h('div', { class: 'ex' }, EXAMPLES.map((e) => h('button', { class: 'chip', type: 'button', onclick: () => { $('q').value = e; search(); } }, e)))));
    renderPreview();
    return;
  }
  const hits = shown();
  sum.hidden = false;
  sum.replaceChildren(h('b', {}, num(hits.length) + '개'), ' · 관련도 ' + (d.min > 0 ? Number(d.min).toFixed(1) + ' 이상' : '제한 없음')
    + ' · ' + (d.elapsed_ms / 1000).toFixed(2) + '초 · 벡터 ' + num(d.searched) + '개에서 찾음');
  if (!hits.length) {
    list.replaceChildren(h('div', { class: 'card empty' }, h('h2', {}, '맞는 결과가 없습니다'),
      h('div', {}, '다른 말로 적어 보거나 최소 관련도를 낮춰 보세요.')));
    renderPreview();
    return;
  }
  list.replaceChildren(...hits.map((hit, i) => {
    const [cls, ic] = look(hit);
    const thumb = hit.thumb != null
      ? h('div', { class: 'thumb' }, h('img', { src: '/api/thumb/' + hit.thumb, alt: '', loading: 'lazy' }))
      : h('div', { class: 'thumb ' + cls }, icon(ic));
    return h('button', { class: 'hit' + (state.sel === i ? ' sel' : ''), type: 'button', 'data-i': i, onclick: () => select(i) },
      thumb,
      h('div', { style: 'min-width:0' },
        h('div', { class: 'l1' }, h('span', { class: 'name', title: hit.name }, hit.name),
          h('span', { class: 'tags' },
            state.tab === 'all' ? h('span', { class: 'tag opt' }, hit.section_label) : null,
            hit.locator ? h('span', { class: 'tag info' }, hit.locator) : null,
            hit.keyword ? h('span', { class: 'tag kw opt' }, '검색어 포함') : null)),
        snippet(hit, 'snip'),
        h('div', { class: 'path', title: hit.path }, h('bdi', {}, hit.path))),
      h('div', { class: 'score ' + tone(hit.score), title: '관련도 ' + hit.score.toFixed(1) }, h('b', {}, hit.score.toFixed(1)),
        h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.max(8, Math.min(100, hit.score * 10)) + '%' }))));
  }));
  renderPreview();
}
function select(i) {
  state.sel = state.sel === i ? null : i;
  document.querySelectorAll('.hit').forEach((el) => el.classList.toggle('sel', Number(el.dataset.i) === state.sel));
  renderPreview();
}

// ── 미리보기 ──
function copyText(text) {
  const done = () => toast('경로를 복사했습니다');
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(done, () => toast('복사하지 못했습니다'));
  const ta = h('textarea', { style: 'position:fixed;opacity:0' }, text);
  document.body.append(ta);
  ta.select();
  const ok = document.execCommand('copy');
  ta.remove();
  ok ? done() : toast('복사하지 못했습니다');
}
function cant(hit, why) {
  return h('div', { class: 'cant' },
    hit.thumb != null ? h('img', { src: '/api/thumb/' + hit.thumb, alt: '', style: 'margin:0 auto 12px;border-radius:8px' }) : null,
    h('div', {}, why));
}
function media(hit) {
  const box = h('div', { class: 'media' });
  const url = hit.open;
  const plain = url.split('#')[0];
  const fail = (why) => box.replaceChildren(cant(hit, why));
  if (hit.kind === 'image') {
    box.append(h('img', { src: plain, alt: hit.name, onerror: () => fail('이 브라우저가 보여 줄 수 없는 이미지 형식입니다. 내려받아 여세요.') }));
  } else if (hit.kind === 'video') {
    box.append(h('video', { src: url, controls: true, preload: 'metadata', playsinline: true,
      poster: hit.thumb != null ? '/api/thumb/' + hit.thumb : null,
      onerror: () => fail('이 브라우저가 재생할 수 없는 영상 형식입니다. 내려받아 여세요.') }));
  } else if (hit.kind === 'audio') {
    box.append(h('audio', { src: url, controls: true, preload: 'metadata', onerror: () => fail('이 브라우저가 재생할 수 없는 소리 형식입니다. 내려받아 여세요.') }));
  } else if (hit.kind === 'doc' && /\.pdf$/i.test(hit.name)) {
    box.append(h('iframe', { src: url, title: hit.name }));
  } else if (hit.kind === 'text') {
    const pre = h('pre', {}, '불러오는 중…');
    box.append(pre);
    fetch(plain, { credentials: 'same-origin' }).then((r) => (r.ok ? r.text() : Promise.reject())).then((t) => {
      const LIMIT = 200000;
      pre.textContent = t.length > LIMIT ? t.slice(0, LIMIT) + '\n\n… (앞부분만 보여 줍니다. 전체는 새 탭에서 여세요.)' : t;
    }).catch(() => fail('내용을 불러오지 못했습니다. 파일을 옮겼거나 지웠을 수 있습니다.'));
  } else {
    box.append(cant(hit, '브라우저에서 미리 볼 수 없는 형식입니다. 내려받아 여세요.'));
  }
  return box;
}
function renderPreview() {
  const pv = $('preview');
  const hit = state.sel != null ? shown()[state.sel] : null;
  $('main').classList.toggle('split', !!hit);
  pv.hidden = !hit;
  if (!hit) {
    pv.replaceChildren();
    pv.dataset.key = '';
    return;
  }
  const key = hit.file_id + ':' + hit.chunk_id;
  if (pv.dataset.key === key) return;
  pv.dataset.key = key;
  pv.replaceChildren(
    h('div', { class: 'pv-head' }, h('span', { class: 'name', title: hit.name }, hit.name),
      h('a', { class: 'btn ghost', href: hit.open, target: '_blank', rel: 'noopener', title: '새 탭에서 열기' }, icon('open')),
      h('a', { class: 'btn ghost', href: hit.open.split('#')[0], download: hit.name, title: '내려받기' }, icon('down')),
      h('button', { class: 'btn ghost', type: 'button', title: '닫기 (Esc)', onclick: () => select(state.sel) }, icon('x'))),
    h('div', { class: 'pv-body' },
      media(hit),
      snippet(hit, 'quote'),
      h('div', { class: 'row' },
        h('span', { class: 'tag' }, hit.section_label),
        hit.locator ? h('span', { class: 'tag info' }, hit.locator) : null,
        hit.keyword ? h('span', { class: 'tag kw' }, '검색어 포함') : null),
      h('div', { class: 'kv' },
        h('span', {}, '관련도'), h('span', {}, hit.score.toFixed(1) + (hit.keyword ? ' (뜻 ' + hit.meaning.toFixed(1) + ' + 검색어)' : '')),
        h('span', {}, '위치'), h('span', {}, hit.path)),
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => copyText(hit.path) }, icon('copy'), '경로 복사'))));
}

// ── 입력 ──
$('form').addEventListener('submit', (ev) => {
  ev.preventDefault();
  search();
});
$('min').addEventListener('input', () => {
  state.minTouched = true;
  setMin($('min').value);
});
$('min').addEventListener('change', () => { if (state.data || state.error) search(); });
$('path').addEventListener('change', () => { if (state.data || state.error) search(); });
document.addEventListener('keydown', (ev) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (ev.key === 'Escape' && state.statusOpen) {
    state.statusOpen = false;
    renderStatus();
  } else if (ev.key === 'Escape' && state.sel != null) {
    select(state.sel);
  } else if (ev.key === '/' && !typing) {
    ev.preventDefault();
    $('q').select();
  } else if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && !(typing && document.activeElement !== $('q'))) {
    const n = shown().length;
    if (!n) return;
    ev.preventDefault();
    const next = state.sel == null ? 0 : Math.max(0, Math.min(n - 1, state.sel + (ev.key === 'ArrowDown' ? 1 : -1)));
    if (next !== state.sel) select(next);
    const el = document.querySelector('.hit.sel');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
});

// ── 시작 ──
(async function start() {
  const params = new URLSearchParams(location.search);
  // 토큰이 붙은 주소로 처음 열면 기억해 두고 주소에서는 지운다
  if (params.get('token')) {
    setToken(params.get('token'));
    params.delete('token');
    history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
  }
  render();
  await poll();
  setInterval(() => { if (!document.hidden && $('gate').hidden) poll(); }, 5000);
  if (params.get('q')) {
    $('q').value = params.get('q');
    search();
  }
})();
</script>
</body>
</html>
